aid: interintellect
name: Interintellect
description: Interintellect is the world's leading salon platform, a creator-led cultural center for
  intellectual conversation founded in March 2019 by art philosopher Anna Gat. The platform lets people
  attend and host high-quality salons and discussions online and offline, across philosophy, technology,
  poetry, history, and the arts, building community around shared intellectual interests. It supports
  independent thinkers and hosts through ticket revenue, training, and a peer community, with paid
  membership tiers granting event access, members-only sessions, community forums, and global in-person
  gatherings. Interintellect is a portfolio company of Bloomberg Beta; it publishes no public API or
  developer platform, so this profile carries identity and website-property signals rather than API
  artifacts.
